# Serves the built SPA. Needed because board URLs are client-side paths
# (whiteboard.unobravo.com/{boardId}): without the fallback nginx looks for a
# directory of that name and returns 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # never fall back for the service worker or the app shell itself
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
