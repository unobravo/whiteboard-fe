# Builds `excalidraw-app/build` and uploads it as the `app-build` artifact.
#
# Reusable so the automatic pipeline and the manual one build identically. They
# used to hold a copy each, and the copies had already drifted on how they pass
# the commit SHA — which is the same argument that put the AWS steps in
# `unobravo-deploy-app.yml`.
name: Build app (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to build. Empty builds whatever triggered the caller."
        required: false
        default: ""
        type: string
    secrets:
      SENTRY_AUTH_TOKEN:
        description: "Uploads sourcemaps. Without it the build still ships; its traces stay minified."
        required: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: yarn

      - run: yarn install --frozen-lockfile --network-timeout 600000

      # The deploy promotes to production unattended, so the unit suite has to
      # gate it here. `test.yml` also runs on pushes to master, but as a separate
      # workflow it races the deploy rather than blocking it.
      - run: yarn test:app --watch=false

      - name: Build
        env:
          # The DSN is public by construction — it ships inside the bundle — so
          # it is a repository variable, not a secret. `excalidraw-app/sentry.ts`
          # sends nothing without it, and the build below refuses to ship
          # without it, so a deploy can never quietly lose error reporting.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          set -euo pipefail
          [ -n "${VITE_SENTRY_DSN:-}" ] || {
            echo "VITE_SENTRY_DSN repository variable is unset — the build would ship with no error reporting (issue #16)." >&2
            exit 1
          }
          # Assigned on its own line: a failed command substitution in an
          # assignment prefix does not set the exit status, so `set -e` would
          # not catch it and the build would be stamped with an empty SHA.
          SHA="$(git rev-parse HEAD)"
          # `excalidraw-app`'s build:app script reads the commit from
          # $VERCEL_GIT_COMMIT_SHA. Feeding it is how the bundle gets a real
          # __EXCALIDRAW_SHA__ without editing an upstream file.
          VERCEL_GIT_COMMIT_SHA="$SHA" yarn build
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      # Before the artifact is uploaded, because `sourcemaps inject` rewrites
      # the emitted .js as well as the .map: the debug ids in the deployed
      # bundle have to be the ones Sentry was told about, or a stack trace
      # symbolicates to nothing. The .map files themselves stay out of S3
      # (`unobravo-deploy-app.yml` excludes them) — Sentry is now the only
      # consumer, which is what #12 left open.
      - name: Upload sourcemaps to Sentry
        # Symbolication is an upgrade to error reporting, not a precondition
        # for deploying, and this step is the only thing in the pipeline that
        # talks to a third party during a build. A rotated token, a Sentry
        # outage or a bad `@sentry/cli` release must not hold staging and
        # production; the guard below only covers the unset case, so the whole
        # step degrades to a warning.
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          # The Unobravo org lives in Sentry's EU region; the default US host
          # would 404 on the project rather than say so.
          SENTRY_URL: ${{ vars.SENTRY_URL }}
        run: |
          set -euo pipefail

          # Named rather than left to `sentry-cli`: unset SENTRY_URL means the
          # default US host and a 404 on an EU-region project, which reads as a
          # missing project rather than a missing variable.
          missing=""
          for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT SENTRY_URL; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done

          # All of them at once: fixing one and rediscovering the next on the
          # following deploy is a slow way to learn what is missing.
          if [ -n "$missing" ]; then
            echo "::warning::unset:$missing — skipping the sourcemap upload; traces from this build will not be symbolicated."
            exit 0
          fi

          # Matches `release: import.meta.env.VITE_APP_GIT_SHA` in
          # excalidraw-app/sentry.ts, so the release Sentry tags an event with
          # is the one holding the maps.
          # Pinned to one version: `npx` resolves from the registry at build
          # time, so a floating range would change what CI runs with no diff to
          # review. Weaker than the SHA pins on this file's `uses:` steps — npm
          # is trusted to keep serving the same bytes for the version — but it
          # closes the drift this file cares about.
          npx --yes @sentry/cli@2.58.6 sourcemaps inject excalidraw-app/build/assets
          npx --yes @sentry/cli@2.58.6 sourcemaps upload \
            --release "$SHA" \
            excalidraw-app/build/assets

      - name: Check the build produced a servable tree
        run: |
          set -euo pipefail

          for path in \
            excalidraw-app/build/index.html \
            excalidraw-app/build/assets \
            excalidraw-app/build/fonts \
            excalidraw-app/build/sw.js \
            excalidraw-app/build/version.json; do
            [ -e "$path" ] || {
              echo "$path missing — the build silently changed shape." >&2
              exit 1
            }
          done

          # The deploy forces `Content-Type: font/woff2` on everything under
          # fonts/, which today is safe only because `assetFileNames` in the
          # upstream vite config routes woff2 there and nothing else. A CSS file
          # arriving in that tree would be served with a font type and silently
          # ignored by every browser.
          stray="$(find excalidraw-app/build/fonts -type f ! -name '*.woff2')"
          [ -z "$stray" ] || {
            echo "non-woff2 files under build/fonts, which the deploy publishes as font/woff2:" >&2
            echo "$stray" >&2
            exit 1
          }

          # A stamped commit is what makes the post-deploy check meaningful.
          grep -q "$SHA" excalidraw-app/build/assets/*.js || {
            echo "$SHA is not in the bundle — VITE_APP_GIT_SHA did not reach the build." >&2
            exit 1
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-build
          path: excalidraw-app/build
          # Long enough to re-run a failed deploy job the next working day
          # without rebuilding.
          retention-days: 7
