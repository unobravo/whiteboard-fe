# Publishes an already-built `excalidraw-app/build` to one environment's S3
# bucket, invalidates its CloudFront distribution, and checks the site actually
# serves what was just uploaded.
#
# Reusable rather than inlined because both callers need the same steps against
# two different sets of repository variables, and a second copy of an
# `aws s3 sync` with cache headers is a second place to get the headers wrong.
# See `unobravo/FORK.md` for why the fork owns these files at all.
name: Deploy app (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "staging or production"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://whiteboard.unobravo.com' || 'https://whiteboard.unobravo.xyz' }}
    permissions:
      contents: read
      id-token: write # OIDC federation to assume the AWS deploy role
    # Held here, per environment, rather than on the two entry workflows: those
    # would serialize staging against production for no reason, and would hold
    # the lock through `yarn install` and the build, so a rollback dispatched
    # while a bad deploy was still building could not get in front of it.
    concurrency:
      group: whiteboard-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      # Fail closed: an unknown environment, or a repository variable that has
      # been renamed or deleted, must stop the job rather than deploy nowhere.
      - name: Resolve target
        id: target
        env:
          TARGET: ${{ inputs.environment }}
          ROLE_DEV: ${{ vars.AWS_ROLE_ARN_DEV }}
          ROLE_PROD: ${{ vars.AWS_ROLE_ARN_PROD }}
          BUCKET_DEV: ${{ vars.AWS_S3_BUCKET_APP_DEV }}
          BUCKET_PROD: ${{ vars.AWS_S3_BUCKET_APP_PROD }}
          DISTRIBUTION_DEV: ${{ vars.CLOUDFRONT_DISTRIBUTION_DEV }}
          DISTRIBUTION_PROD: ${{ vars.CLOUDFRONT_DISTRIBUTION_PROD }}
          # Unlike the three above, these are optional: unset, the build's own
          # public/ws-config.json default ships as-is. There is no build-time
          # equivalent to diverge from — see unobravo/collab/relayUrl.ts for why.
          WS_SERVER_URL_DEV: ${{ vars.WS_SERVER_URL_DEV }}
          WS_SERVER_URL_PROD: ${{ vars.WS_SERVER_URL_PROD }}
        run: |
          set -euo pipefail

          # The `_DEV` variables are the staging account: platform named them
          # before the environments were called staging and production.
          case "$TARGET" in
            staging)
              role="$ROLE_DEV" bucket="$BUCKET_DEV" distribution="$DISTRIBUTION_DEV"
              ws_server_url="$WS_SERVER_URL_DEV"
              ;;
            production)
              role="$ROLE_PROD" bucket="$BUCKET_PROD" distribution="$DISTRIBUTION_PROD"
              ws_server_url="$WS_SERVER_URL_PROD"
              ;;
            *)
              echo "Unknown environment '$TARGET' — expected 'staging' or 'production'." >&2
              exit 1
              ;;
          esac

          for pair in role:"$role" bucket:"$bucket" distribution:"$distribution"; do
            [ -n "${pair#*:}" ] || {
              echo "Missing repository variable for the '$TARGET' ${pair%%:*} — check AWS_ROLE_ARN_*/AWS_S3_BUCKET_APP_*/CLOUDFRONT_DISTRIBUTION_*." >&2
              exit 1
            }
          done

          # A line break in a repository variable would let it write a second
          # line into $GITHUB_OUTPUT and redirect one of the other two values.
          for value in "$role" "$bucket" "$distribution" "$ws_server_url"; do
            case "$value" in
              *$'\n'* | *$'\r'*)
                echo "A repository variable for '$TARGET' contains a line break." >&2
                exit 1
                ;;
            esac
          done

          {
            echo "role=$role"
            echo "bucket=$bucket"
            echo "distribution=$distribution"
            echo "ws_server_url=$ws_server_url"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-build
          path: build

      # Overwrites the build's baked-in public/ws-config.json default with
      # this environment's value, so the one shared build artifact can still
      # point staging and production at different relays. Skipped when unset
      # so an unconfigured environment keeps shipping that default rather than
      # an empty URL.
      - name: Write per-environment relay config
        if: steps.target.outputs.ws_server_url != ''
        env:
          WS_SERVER_URL: ${{ steps.target.outputs.ws_server_url }}
        run: |
          set -euo pipefail
          jq -n --arg url "$WS_SERVER_URL" '{wsServerUrl: $url}' > build/ws-config.json

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ steps.target.outputs.role }}
          aws-region: eu-central-1

      - name: Sync to S3
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
        run: |
          set -euo pipefail

          # A truncated artifact must not half-deploy over a working site.
          for path in build/index.html build/assets build/fonts; do
            [ -e "$path" ] || {
              echo "$path missing from the artifact — check the build job's outDir." >&2
              exit 1
            }
          done

          # Fonts first: `woff2BrowserPlugin` rewrites @font-face sources to
          # absolute /fonts/… urls that live inside the assets/ chunks, so the
          # referenced file has to be there before the chunk that names it.
          # Some upstream families ship unhashed filenames (Assistant, Virgil,
          # LiberationSans, CascadiaCode), so no `immutable` here. The explicit
          # content type does not depend on what the aws-cli's mimetypes knows;
          # the build job asserts nothing but woff2 is in this tree.
          aws s3 sync build/fonts "s3://$BUCKET/fonts" \
            --cache-control 'public,max-age=2592000' \
            --content-type font/woff2

          # Content-hashed by vite, so a changed file always has a new name:
          # --size-only is safe and stops every deploy re-uploading 31 MB
          # because the artifact's mtimes are always newer than S3's.
          # --exclude '*.map': sourcemaps stay in the CI artifact but never reach
          # the CDN — nothing symbolicates them (Sentry disabled) and they roughly
          # double the published bundle. See issue #12.
          aws s3 sync build/assets "s3://$BUCKET/assets" \
            --size-only \
            --exclude '*.map' \
            --cache-control 'public,max-age=31536000,immutable'

          # index.html, sw.js, version.json, the icons — last, so nothing that
          # names a hashed file is published before that file exists.
          # No --delete anywhere: a tab loaded before this deploy still resolves
          # its lazy imports against the previous hashed chunks.
          aws s3 sync build "s3://$BUCKET" \
            --exclude 'assets/*' \
            --exclude 'fonts/*' \
            --exclude '*.map' \
            --cache-control 'no-cache'

          # Explicit because a manifest served as octet-stream costs the PWA its
          # install metadata, and the aws-cli only guesses this one correctly on
          # recent Pythons.
          aws s3 cp build/manifest.webmanifest "s3://$BUCKET/manifest.webmanifest" \
            --content-type application/manifest+json \
            --cache-control 'no-cache'

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ steps.target.outputs.distribution }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*'

      # Without this, `deploy-production: needs: deploy-staging` only proves
      # `aws s3 sync` exited 0. How we prove it differs by environment, because
      # what is reachable differs — see `unobravo/FORK.md`, "Staging is a gate".
      - name: Check the deploy landed
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUCKET: ${{ steps.target.outputs.bucket }}
          URL: ${{ inputs.environment == 'production' && 'https://whiteboard.unobravo.com' || 'https://whiteboard.unobravo.xyz' }}
        run: |
          set -euo pipefail
          # `build:version` writes this into version.json and into index.html's
          # `<meta name="version">`, so one string proves both are the new build.
          expected="$(jq -r .version build/version.json)"

          # Staging sits behind the ZTN WAF, whose allow-list is the staging
          # VPC's NAT gateways, so a GitHub runner can never reach it over HTTP.
          # Verify the object landed in S3 with this build's version instead,
          # using the same OIDC role the sync used. S3 is read-after-write
          # consistent, so no retry: if it is not there now, the sync did not
          # put it. The public HTTP assertion below only makes sense for
          # production, which has no ZTN and is what users actually hit.
          if [ "$ENVIRONMENT" != "production" ]; then
            served="$(aws s3 cp "s3://$BUCKET/version.json" - | jq -r .version)"
            [ "$served" = "$expected" ] || {
              echo "s3://$BUCKET/version.json is '${served:-nothing}', want '$expected' — the sync did not land this build." >&2
              exit 1
            }
            # Everything deep-links back to index.html; prove it is actually there.
            aws s3api head-object --bucket "$BUCKET" --key index.html >/dev/null || {
              echo "index.html is not in s3://$BUCKET — the entrypoint did not upload." >&2
              exit 1
            }
            echo "s3://$BUCKET has $expected (version.json and index.html present)."
            exit 0
          fi

          # Production is public, so assert the distribution really serves this
          # build. Two checks, because they fail for different reasons:
          # version.json catches a bad or stale upload, and the document at `/`
          # catches a distribution with no `defaultRootObject` — which would
          # serve the app fine at every deep link and 403 on the front page.
          # The invalidation is asynchronous, so retry rather than race it.
          for attempt in $(seq 1 6); do
            served="$(curl -fsS --max-time 20 "$URL/version.json" | jq -r .version || true)"
            if [ "$served" = "$expected" ]; then
              if curl -fsS --max-time 20 "$URL/" | grep -q "$expected"; then
                echo "$URL serves $expected, at /version.json and at /"
                exit 0
              fi
              echo "attempt $attempt: $URL/version.json is current but / does not serve this index.html"
            else
              echo "attempt $attempt: $URL/version.json is '${served:-nothing}', want '$expected'"
            fi
            sleep 10
          done

          echo "$URL never served $expected from both /version.json and /. The upload or the distribution is wrong — do not promote this." >&2
          exit 1
